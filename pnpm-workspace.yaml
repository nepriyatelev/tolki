# Single-package repo: this file only holds pnpm settings.
allowBuilds:
  # Squirrel.Windows installer pulled in by electron-builder; we ship NSIS instead.
  electron-winstaller: false
  # SFU worker: postinstall downloads the prebuilt mediasoup-worker binary for this OS.
  mediasoup: true
  # Push-to-talk key hook (PLAN #39): prebuilt N-API binaries for every OS ship in the package.
  uiohook-napi: false
