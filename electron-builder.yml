# Installers: `pnpm dist` builds for the current OS into release/.
# appId must never change after the first release (NSIS registry key, macOS bundle id).
appId: io.github.nepriyatelev.tolki
productName: Tolki
copyright: Copyright © 2026 Tolki contributors

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# No rebuilding native modules for Electron: uiohook-napi is N-API and ships prebuilt binaries
# for every OS (development and CI use them too, see allowBuilds in pnpm-workspace.yaml);
# building it from source needs X11 headers on Linux. mediasoup's worker is a separate binary.
npmRebuild: false

# Native binaries cannot be executed from inside app.asar.
asarUnpack:
  - '**/node_modules/mediasoup/worker/out/Release/mediasoup-worker*'

# Shown in "About" (fonts and icons are open-licensed, see docs/PLAN.md §3).
extraResources:
  - from: build/licenses
    to: licenses
  # Icon for the user-level .desktop entry an AppImage writes on first start.
  - from: build/icons/256x256.png
    to: icons/tolki.png
  # Tray icon (#44), with the @2x one for dense displays.
  - from: build/icons/16x16.png
    to: icons/tray.png
  - from: build/icons/32x32.png
    to: icons/tray@2x.png
  # Window icon on Linux (Windows and macOS take it from the build).
  - from: build/icons/512x512.png
    to: icons/tolki-512.png

# tolki:// invite links: Info.plist on macOS, MimeType in .desktop on Linux.
# Windows registers at runtime (app.setAsDefaultProtocolClient), NSIS does not.
protocols:
  - name: Tolki invite
    schemes:
      - tolki

# Only the UI languages we ship; trims ~40 MB of Chromium locales.
electronLanguages:
  - ru
  - en-US

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  target: dmg
  # Already padded to Apple's icon grid: same size in the Dock as other apps.
  icon: build/icon.icns
  category: public.app-category.social-networking
  # Ad-hoc signature: required on Apple Silicon, no Developer ID yet (PLAN.md §8).
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: Tolki использует микрофон для голосовых звонков.
    # CoreAudio taps (macOS 14.2+): the computer's sound with a shared screen (#41).
    NSAudioCaptureUsageDescription: Tolki передаёт звук компьютера участникам, когда экран показывается со звуком.

dmg:
  title: ${productName} ${version}

win:
  target: nsis
  icon: build/icon.ico

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: Tolki

linux:
  # Lower case, as Linux binaries are; on macOS and Windows it stays Tolki.app / Tolki.exe.
  executableName: tolki
  target:
    - AppImage
    - deb
  # 16–48 px show the letter «t», from 64 px the word «tolki» — on purpose.
  icon: build/icons
  category: Network
  # Window ↔ .desktop association (app_id / WM_CLASS), also needed for deep links.
  syncDesktopName: true
  synopsis: Голосовые звонки и демонстрация экрана
  maintainer: Tolki contributors

deb:
  packageCategory: net

# Auto-update (#46): app-update.yml inside the app and latest*.yml next to the installers point
# electron-updater at this repository's releases; the app pins the feed to the release its own
# check found (auto-update.ts). The release workflow uploads them itself (`--publish never`);
# electron-builder never publishes.
publish:
  provider: github
  owner: nepriyatelev
  repo: tolki
