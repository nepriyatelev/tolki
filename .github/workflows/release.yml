name: Release

# Tag vX.Y.Z (a release) or vX.Y.Z-rc.N (a pre-release) → installers for every OS → a GitHub
# release in this repository. The version comes from the tag; package.json keeps 0.0.0 for
# development builds. Any other vX.Y.Z-… tag starts the workflow only to fail on it.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Only a release and its pre-releases: «-rc10» would sort before «-rc9», and the app reads no
  # other suffix (update-check.ts). Such tags stop here, before any build.
  tag:
    name: check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: vX.Y.Z or vX.Y.Z-rc.N
        run: |
          n='(0|[1-9][0-9]*)'
          if [[ ! "$GITHUB_REF_NAME" =~ ^v$n\.$n\.$n(-rc\.$n)?$ ]]; then
            echo "::error::Тег $GITHUB_REF_NAME не подходит: нужен vX.Y.Z (релиз) или vX.Y.Z-rc.N (пререлиз, например v0.1.0-rc.1)"
            exit 1
          fi

  build:
    name: build ${{ matrix.name }}
    needs: tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            builder: --win nsis --x64
            app: release/win-unpacked/Tolki.exe
          - name: macos-arm64
            os: macos-26
            builder: --mac dmg --arm64
            app: release/mac-arm64/Tolki.app/Contents/MacOS/Tolki
          - name: macos-x64
            os: macos-26-intel
            builder: --mac dmg --x64
            app: release/mac/Tolki.app/Contents/MacOS/Tolki
          - name: linux-x64
            os: ubuntu-latest
            builder: --linux AppImage deb --x64
            app: release/linux-unpacked/tolki
    env:
      # No Developer ID yet: ad-hoc signing only (electron-builder.yml), no keychain lookup.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build installers
        shell: bash
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder ${{ matrix.builder }} --publish never \
            -c.extraMetadata.version="${GITHUB_REF_NAME#v}"

      # Smoke test: the packaged app starts and passes the e2e suite on its own OS.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test packaged app
        shell: bash
        env:
          E2E_EXECUTABLE: ${{ matrix.app }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum pnpm exec playwright test
          else
            pnpm exec playwright test
          fi

      # What a failed test saw (screenshots, error-context), to find out why.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.name }}
          path: test-results/
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.exe.blockmap
            release/latest.yml
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The built-in token creates the release here; no other repository, no personal token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: .github/release-notes.sh "$GITHUB_REF_NAME" > notes.md && cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An rc is a pre-release: «latest» stays the last release, and only those already on
          # a pre-release update to it (update-check.ts).
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tolki ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            "${prerelease[@]}"
