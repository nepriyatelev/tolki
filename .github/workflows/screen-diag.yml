name: Screen capture diagnostics (#123)

# Temporary: runs the screen e2e on the packaged app on the Intel and the Apple Silicon macOS
# runners, with capture on, and keeps everything that tells where it hangs. Removed once #123
# is understood.
on:
  push:
    branches: ['issue-123-*']

permissions:
  contents: read

jobs:
  diag:
    name: screen e2e ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            os: macos-26-intel
            builder: --mac dir --x64
            app: release/mac/Tolki.app/Contents/MacOS/Tolki
          - name: macos-arm64
            os: macos-26
            builder: --mac dir --arm64
            app: release/mac-arm64/Tolki.app/Contents/MacOS/Tolki
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build the app
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder ${{ matrix.builder }} --publish never

      - name: The runner's displays and macOS
        run: |
          sw_vers
          system_profiler SPDisplaysDataType || true

      - name: Screen e2e with capture on
        env:
          E2E_EXECUTABLE: ${{ matrix.app }}
          E2E_SCREEN_DIAG: '1'
          # Each launch's userData (with its logs) lands in test-results and is uploaded.
          TMPDIR: ${{ github.workspace }}/test-results/tmp
        run: |
          mkdir -p "$TMPDIR"
          pnpm exec playwright test e2e/zz-screen-diag.spec.ts e2e/screen-share.spec.ts:23 \
            --trace retain-on-failure --timeout 60000

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-diag-${{ matrix.name }}
          path: test-results/
          retention-days: 7
